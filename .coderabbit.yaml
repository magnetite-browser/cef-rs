# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit reviews pull requests: useful, low noise, nothing kept or shared
# beyond the review itself.
language: en-US
tone_instructions: >-
  Be brief and concrete. Plain English. Only comment when something is wrong,
  risky or clearly simpler another way.
early_access: false

reviews:
  profile: chill
  # No automatic approvals or change requests; maintainers decide.
  auto_approvals:
    enabled: false
  high_level_summary: true
  poem: false
  in_progress_fortune: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    base_branches: ["^magnetite$"]
  path_filters:
    - "!Cargo.lock"
    # Generated by update-bindings from the CEF headers.
    - "!sys/src/bindings/**"
    - "!cef/src/bindings/**"
  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: warning
      requirements: >-
        Conventional Commits with a short subject, e.g. "chore: bindings for
        CEF 156.0.30". Types: feat, fix, docs, refactor, test,
        build, ci, chore, perf.
  path_instructions:
    - path: "**"
      instructions: |
        A fork of tauri-apps/cef-rs for the Magnetite browser (MAGNETITE.md). It stays as close
        to upstream as it can: a pull request should change the CEF version and its generated
        bindings, merge upstream, or touch the fork's own files (MAGNETITE.md, .coderabbit.yaml,
        .github/workflows/magnetite.yml). Flag any other change to upstream's code and ask
        whether it was sent upstream. Do not review code that only arrives through a merge of
        upstream.
    - path: "Cargo.toml"
      instructions: |
        The workspace version is "<crate version>+<CEF version>". The CEF version must match the
        constants in sys/src/bindings/*.rs for every target.
    - path: ".github/**"
      instructions: |
        Workflows pin every action to a full commit SHA and ask for no more than read access.
    - path: "**/*.md"
      instructions: |
        Plain, short English. Facts (commands, file names, versions) must match the
        repository. No marketing language.

chat:
  art: false
  auto_reply: false
  integrations:
    jira:
      usage: disabled
    linear:
      usage: disabled

knowledge_base:
  # No data kept between reviews (learnings, indexed issues and PRs).
  opt_out: true
  web_search:
    enabled: false
  code_guidelines:
    enabled: true
    filePatterns:
      - MAGNETITE.md
  jira:
    usage: disabled
  linear:
    usage: disabled
  mcp:
    usage: disabled
  automatic_linking_mode: disabled

issue_enrichment:
  auto_enrich:
    enabled: false
  planning:
    enabled: false
